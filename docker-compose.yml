services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - runtime_data:/app/runtime
    networks: [arbnet]

  # Legacy research infrastructure. Start with: docker compose --profile legacy up
  db:
    image: postgres:16
    profiles: [legacy]
    restart: unless-stopped
    environment:
      POSTGRES_USER: arb
      POSTGRES_PASSWORD: arbpass
      POSTGRES_DB: arb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:1488:5432"
    networks: [arbnet]

  redis:
    image: redis:7-alpine
    profiles: [legacy]
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    networks: [arbnet]

volumes:
  runtime_data:
  pgdata:
  redisdata:

networks:
  arbnet:
    driver: bridge
