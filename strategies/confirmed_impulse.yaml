  min_trade_flow_imbalance: 0.10
  exit_momentum_bps: 5
  exit_book_imbalance: -0.05
  exit_trade_flow_imbalance: -0.05
  max_quote_age_seconds: 3
  stop_loss_bps: 60
  take_profit_bps: 120
  max_hold_seconds: 300
